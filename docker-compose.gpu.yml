# NVIDIA override. Use together with docker-compose.yml on the RTX host:
# docker-compose -f docker-compose.yml -f docker-compose.gpu.yml --profile train build train
# docker-compose -f docker-compose.yml -f docker-compose.gpu.yml up -d orchestrator
services:
  orchestrator:
    runtime: nvidia
    environment:
      DERMS_IMAGE: derms-r-train:cuda
      # This box lives in Tijuana; the scheduling window (System Settings)
      # compares against the container's local clock, which defaults to UTC
      # otherwise -- 7-8 hours off from what you'd expect when picking hours.
      TZ: America/Tijuana
      # The orchestrator's base image (python:3.12-slim) isn't a CUDA image, so
      # it doesn't set these itself -- without them the nvidia-container-runtime
      # hook has nothing telling it to inject the host driver/nvidia-smi, even
      # with `runtime: nvidia` selected.
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: utility

  train:
    image: derms-r-train:cuda
    build:
      dockerfile: Dockerfile

  inference-api:
    image: derms-r-train:cuda
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

  triton-server:
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
