# Same MLflow server as docker-compose.yml's `mlflow` service
# (ghcr.io/mlflow/mlflow:v2.9.2, sqlite backend, local artifact root), just
# running as a cluster-internal Deployment+Service instead of a Compose
# container. Training Jobs point --mlflow-tracking-uri at
# http://mlflow.derms-r.svc.cluster.local:5000 (see ../60-jobs/job-template.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: derms-r
  labels:
    app: mlflow
spec:
  replicas: 1
  strategy:
    type: Recreate # sqlite backend: never run 2 replicas at once
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v2.9.2
          command:
            - mlflow
            - server
            - --host=0.0.0.0
            - --port=5000
            - --backend-store-uri=sqlite:////mlflow/mlflow.db
            - --default-artifact-root=/mlflow/artifacts
          ports:
            - containerPort: 5000
              name: http
          volumeMounts:
            - name: mlflow-data
              mountPath: /mlflow
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "2Gi" }
      volumes:
        - name: mlflow-data
          persistentVolumeClaim:
            claimName: derms-mlflow-data
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: derms-r
spec:
  selector:
    app: mlflow
  ports:
    - port: 5000
      targetPort: 5000
      name: http
---
# Optional: expose the MLflow UI outside the cluster for convenience.
# Swap for an Ingress if you already run one; NodePort needs no extra controller.
apiVersion: v1
kind: Service
metadata:
  name: mlflow-nodeport
  namespace: derms-r
spec:
  type: NodePort
  selector:
    app: mlflow
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500
