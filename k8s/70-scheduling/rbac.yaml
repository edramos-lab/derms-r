apiVersion: v1
kind: ServiceAccount
metadata:
  name: derms-job-scheduler
  namespace: derms-r
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: derms-job-suspender
  namespace: derms-r
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: derms-job-scheduler-binding
  namespace: derms-r
subjects:
  - kind: ServiceAccount
    name: derms-job-scheduler
    namespace: derms-r
roleRef:
  kind: Role
  name: derms-job-suspender
  apiGroup: rbac.authorization.k8s.io
